name: Android APK

# Se ejecuta a mano desde la pestaña Actions o al publicar un tag v*.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Pruebas y APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Asegurar Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Análisis estático
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        working-directory: mobile
        run: flutter test

      - name: Compilar APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumen
        run: |
          ls -lh mobile/build/app/outputs/flutter-apk/app-release.apk
          {
            echo "### APK listo"
            echo ""
            echo "Descarga el artefacto **finanzas-apk-${{ github.run_number }}** en esta ejecución."
            echo "Cópialo al teléfono y ábrelo para instalar (permitiendo orígenes desconocidos)."
          } >> "$GITHUB_STEP_SUMMARY"
